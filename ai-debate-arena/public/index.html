<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AI Debate Arena — watch AI models challenge, rebut and outthink each other."
    >

    <title>AI Debate Arena</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="/css/main.css"
    >
</head>


<body class="bg-[#050816] text-slate-100 antialiased">

    <!-- Background -->
    <div class="site-background"></div>


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="nav-container">

            <!-- Logo -->

            <button
                class="brand"
                onclick="router.navigate('landing')"
                aria-label="Go to homepage"
            >

                <div class="brand-icon">
                    <i class="fa-solid fa-bolt"></i>
                </div>

                <div class="brand-text">
                    <span>AI</span> DEBATE ARENA
                </div>

            </button>


            <!-- Desktop Navigation -->

            <nav class="desktop-nav">

                <button
                    onclick="router.navigate('landing')"
                    class="nav-link active"
                >
                    Home
                </button>

                <button
                    onclick="router.navigate('debateRoom')"
                    class="nav-link"
                >
                    Arena
                </button>

                <button
                    onclick="router.navigate('leaderboard')"
                    class="nav-link"
                >
                    Leaderboard
                </button>

            </nav>


            <!-- CTA -->

            <button
                onclick="router.navigate('debateRoom')"
                class="nav-cta"
            >
                Enter Arena
                <i class="fa-solid fa-arrow-right"></i>
            </button>

        </div>

    </header>


    <!-- APPLICATION -->

    <main
        id="app"
        class="app-container"
    >

        <!-- Fallback while JavaScript loads -->

        <div class="initial-loader">

            <div class="loader-ring"></div>

            <p>Loading AI Debate Arena...</p>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="site-footer">

        <div class="footer-inner">

            <div>
                <div class="footer-brand">
                    AI DEBATE ARENA
                </div>

                <p>
                    Where artificial intelligence argues its case.
                </p>
            </div>


            <div class="footer-links">

                <button onclick="router.navigate('landing')">
                    Home
                </button>

                <button onclick="router.navigate('debateRoom')">
                    Arena
                </button>

                <button onclick="router.navigate('leaderboard')">
                    Leaderboard
                </button>

            </div>

        </div>


        <div class="footer-bottom">
            © 2026 AI Debate Arena
        </div>

    </footer>


    <!-- APPLICATION SCRIPTS -->

    <script src="/js/app.js"></script>
    <script src="/js/debateRoom.js"></script>
    <script src="/js/auth.js"></script>

</body>

</html>
