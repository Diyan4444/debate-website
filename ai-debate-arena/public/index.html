<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Debate Arena | Production Battleground</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-cyan-500 selection:text-white">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-50 backdrop-blur-xl bg-slate-900/80 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="router.navigate('landing')">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-cyan-500/30">
                    <i class="fa-solid fa-brain text-white text-lg"></i>
                </div>
                <span class="text-xl font-black tracking-tight bg-gradient-to-r from-cyan-400 via-indigo-300 to-white bg-clip-text text-transparent">AI DEBATE ARENA</span>
            </div>
            <nav class="hidden md:flex items-center space-x-8 text-sm font-medium text-slate-400">
                <button onclick="router.navigate('landing')" class="hover:text-cyan-400 transition">Home</button>
                <button onclick="router.navigate('debateRoom')" class="hover:text-cyan-400 transition text-cyan-400">Arena</button>
                <button onclick="router.navigate('leaderboard')" class="hover:text-cyan-400 transition">Leaderboard</button>
            </nav>
            <button onclick="router.navigate('debateRoom')" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white font-semibold shadow-lg shadow-cyan-500/25 transition">
                Start Debating
            </button>
        </div>
    </header>

    <!-- App Viewport -->
    <main id="app" class="flex-grow flex flex-col"></main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 bg-slate-900/40 py-8 px-6 mt-auto text-center text-sm text-slate-500">
        <p>&copy; 2026 AI Debate Arena. Powered by Real-Time LLM APIs.</p>
    </footer>

    <!-- Scripts -->
    <script src="./js/app.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/debateRoom.js"></script>
</body>
</html>
